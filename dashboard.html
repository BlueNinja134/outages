<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outages Status</title>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --green: #238636;
            --red: #da3633;
            --up: #57F287;
            --down: #ED4245;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .service-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .service-row:last-child { border-bottom: none; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge.up { background: rgba(87, 242, 135, 0.15); color: var(--up); }
        .badge.down { background: rgba(237, 66, 69, 0.15); color: var(--down); }
        .login-box { max-width: 400px; margin: 80px auto; text-align: center; }
        input[type="password"], input[type="text"] { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; box-sizing: border-box; margin-bottom: 12px; }
        button { background: var(--green); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .admin-panel { margin-top: 40px; border-top: 1px dashed var(--border); padding-top: 24px; display: none; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="card">
            <h2>Loading status...</h2>
        </div>
    </div>

    <!-- Embedded Dashboard Data Payload -->
    <script>
        window.BLOB = __DASHBOARD_DATA__;
    </script>

    <!-- Dashboard Renderer & Admin Maintenance Logic -->
    <script>
        async function decryptPayload(blob, password) {
            const enc = new TextEncoder();
            const dec = new TextDecoder();
            const salt = Uint8Array.from(atob(blob.salt), c => c.charCodeAt(0));
            const iv = Uint8Array.from(atob(blob.iv), c => c.charCodeAt(0));
            const ct = Uint8Array.from(atob(blob.ct), c => c.charCodeAt(0));

            const keyMaterial = await crypto.subtle.importKey(
                "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
            );
            const key = await crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: blob.iter, hash: "SHA-256" },
                keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
            );
            const decrypted = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv: iv }, key, ct
            );
            return JSON.parse(dec.decode(decrypted));
        }

        async function init() {
            const app = document.getElementById("app");
            const blob = window.BLOB;

            if (blob.mode === "plain") {
                renderDashboard(blob.payload, false);
            } else {
                // Encrypted admin page
                const savedPass = sessionStorage.getItem("dashboard_password");
                if (savedPass) {
                    try {
                        const payload = await decryptPayload(blob, savedPass);
                        renderDashboard(payload, true);
                        return;
                    } catch (e) {
                        sessionStorage.removeItem("dashboard_password");
                    }
                }
                renderLogin();
            }
        }

        function renderLogin() {
            const app = document.getElementById("app");
            app.innerHTML = `
                <div class="card login-box">
                    <h2>🔒 Admin Login</h2>
                    <p style="color: var(--text-muted); font-size: 13px;">Enter your dashboard password to access management controls.</p>
                    <form onsubmit="handleLogin(event)">
                        <input type="password" id="pass" placeholder="Password" required>
                        <button type="submit" style="width: 100%;">Unlock Dashboard</button>
                        <div id="login-err" style="color: var(--down); font-size: 13px; margin-top: 10px;"></div>
                    </form>
                </div>
            `;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById("pass").value;
            const errEl = document.getElementById("login-err");
            try {
                const payload = await decryptPayload(window.BLOB, pass);
                sessionStorage.setItem("dashboard_password", pass);
                window.isAdminUnlocked = true;
                renderDashboard(payload, true);
            } catch (err) {
                errEl.innerText = "Incorrect password.";
            }
        }

        function renderDashboard(data, isAdmin) {
            const app = document.getElementById("app");
            let servicesHtml = data.services.map(s => `
                <div class="service-row">
                    <div>
                        <strong>${s.name}</strong><br>
                        <small style="color: var(--text-muted);">${s.target} - ${s.detail}</small>
                    </div>
                    <div>
                        <span class="badge ${s.status === 'up' ? 'up' : 'down'}">${s.status.toUpperCase()}</span>
                    </div>
                </div>
            `).join("");

            app.innerHTML = `
                <div class="header">
                    <h1>${data.title}</h1>
                    ${isAdmin ? '<button onclick="handleLogout()" style="background: var(--red);">Logout</button>' : ''}
                </div>
                <div class="card">
                    <h3>Services Overview</h3>
                    ${servicesHtml}
                </div>

                ${isAdmin ? `
                <div class="card admin-panel" id="admin-maintenance-card" style="display: block;">
                    <h3 style="margin-top: 0; color: #f0f6fc;">🛠️ Quick Maintenance Control</h3>
                    <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 12px;">Select services to place into maintenance mode immediately:</p>
                    
                    <div id="maint-checkboxes" style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 15px;">
                        <label style="cursor: pointer;"><input type="checkbox" value="website"> Website</label>
                        <label style="cursor: pointer;"><input type="checkbox" value="minecraft"> Minecraft</label>
                    </div>

                    <input type="text" id="maint-reason" placeholder="Reason (e.g., Scheduled update)">
                    
                    <div style="display: flex; gap: 10px; align-items: center; margin-top: 12px;">
                        <button onclick="submitMaintenance()">Apply Maintenance</button>
                        <button onclick="clearMaintenance()" style="background: var(--red);">Clear All</button>
                        <span id="maint-status" style="font-size: 13px;"></span>
                    </div>
                </div>
                ` : ''}
            `;
        }

        function handleLogout() {
            sessionStorage.removeItem("dashboard_password");
            init();
        }

        async function submitMaintenance() {
            const statusEl = document.getElementById("maint-status");
            statusEl.innerText = "Updating...";
            statusEl.style.color = "var(--text-muted)";
            
            const checkboxes = document.querySelectorAll('#maint-checkboxes input:checked');
            const reason = document.getElementById("maint-reason").value || "Under maintenance";
            
            let payload = {};
            checkboxes.forEach(cb => { payload[cb.value] = reason; });

            try {
                const workerUrl = "https://github-outage-trigger.blueninja5135.workers.dev/?key=YOUR_SECRET";
                const response = await fetch(workerUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    statusEl.style.color = "var(--up)";
                    statusEl.innerText = "✅ Triggered! GitHub will update in ~45s.";
                } else {
                    throw new Error("Failed");
                }
            } catch (err) {
                statusEl.style.color = "var(--down)";
                statusEl.innerText = "❌ Error triggering update.";
            }
        }

        async function clearMaintenance() {
            const statusEl = document.getElementById("maint-status");
            statusEl.innerText = "Clearing...";
            statusEl.style.color = "var(--text-muted)";
            try {
                const workerUrl = "https://github-outage-trigger.blueninja5135.workers.dev/?key=YOUR_SECRET&maintenance=false";
                await fetch(workerUrl);
                statusEl.style.color = "var(--up)";
                statusEl.innerText = "✅ Maintenance cleared!";
            } catch (e) {
                statusEl.style.color = "var(--down)";
                statusEl.innerText = "❌ Failed to clear.";
            }
        }

        init();
    </script>
</body>
</html>
