name: Outage Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes (GitHub's fastest interval)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install discord.py

      - name: Run outage monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MONITOR_BOT_TOKEN: ${{ secrets.MONITOR_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          BOT_IDS: ${{ secrets.BOT_IDS }}
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
          MC_SERVER_IP: ${{ secrets.MC_SERVER_IP }}
        run: python monitor.py

      - name: Keep workflow alive (Monthly)
        if: always()
        run: |
          if [ "$(date +%d)" = "01" ] && [ "$(date +%H)" = "00" ]; then
            date -u > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@://github.com"
            git add .keepalive
            git commit -m "Keep scheduled workflow active" || exit 0
            git push
          fi
