name: Outage Monitor

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-deployment"
  cancel-in-progress: true

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests dnspython discord.py cryptography

      - name: Run outage monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MONITOR_BOT_TOKEN: ${{ secrets.MONITOR_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          BOT_IDS: ${{ secrets.BOT_IDS }}
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
          MC_SERVER_IP: ${{ secrets.MC_SERVER_IP }}
          ALERT_ROLE_ID: ${{ secrets.ALERT_ROLE_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python monitor.py

      - name: Save status state & keep repo alive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$(date +%d)" = "01" ] && [ "$(date +%H)" = "00" ]; then
            date -u > .keepalive
          fi

          git add status.json .keepalive 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update service status state"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
